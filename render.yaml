# Render Blueprint — deploy the FastAPI backend (free tier).
# IMPORTANT: Root Directory must be the repo root (blank), NOT backend/.
services:
  - type: web
    name: btc-pl
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      # Leave unset to use repo-root btc_daily.csv / assets_daily.csv.
      # Do NOT set BTC_DAILY_CSV_PATH to "." or "" — that breaks loading.