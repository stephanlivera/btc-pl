# Render Blueprint — deploy the FastAPI backend (free tier).
# Dashboard: New → Blueprint → connect this repo, or create a Web Service manually.
services:
  - type: web
    name: btc-pl-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"